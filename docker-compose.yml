services:
  # ------------------------------------------------------------
  # HillResQ Full-Stack Application (Express API + React Frontend)
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hillresq-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hillresq
      - JWT_SECRET=hillresq_super_secure_jwt_production_secret_2026
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/src/uploads
    networks:
      - hillresq-network

  # ------------------------------------------------------------
  # MongoDB Database Service
  # ------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hillresq-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=hillresq
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hillresq-network

volumes:
  mongo_data:
    name: hillresq_mongo_data
  uploads_data:
    name: hillresq_uploads_data

networks:
  hillresq-network:
    name: hillresq_network
    driver: bridge

